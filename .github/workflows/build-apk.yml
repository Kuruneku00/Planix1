name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check environment
        shell: bash
        run: |
          set -e

          echo "Node:"
          node --version

          echo "npm:"
          npm --version

          echo "Java:"
          java -version

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          test -f package.json
          test -f package-lock.json
          test -d android
          test -f android/gradlew
          test -d android/app

          echo "Project structure OK."

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          npm ci --no-audit --no-fund

      - name: Verify Capacitor
        shell: bash
        run: |
          set -e
          npx cap --version

      - name: Build web application
        shell: bash
        run: |
          set -e
          npm run build

      - name: Verify web build
        shell: bash
        run: |
          set -e

          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html was not created."
            exit 1
          fi

          echo "Web build verified successfully."

      - name: Sync Capacitor
        shell: bash
        run: |
          set -e
          npx cap sync android

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          if [ -n "$ANDROID_HOME" ]; then
            SDK_PATH="$ANDROID_HOME"
          elif [ -n "$ANDROID_SDK_ROOT" ]; then
            SDK_PATH="$ANDROID_SDK_ROOT"
          else
            echo "ERROR: Android SDK was not found."
            exit 1
          fi

          echo "sdk.dir=$SDK_PATH" > android/local.properties

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p android/keystore

          echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/release.jks

          if [ ! -s android/keystore/release.jks ]; then
            echo "ERROR: Keystore file was not created."
            exit 1
          fi

          echo "Release keystore restored successfully."

      - name: Prepare Gradle
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew --version

      - name: Build signed Release APK
        working-directory: android
        shell: bash
        env:
          RELEASE_STORE_FILE: keystore/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleRelease \
            --stacktrace \
            --info \
            --console=plain \
            --warning-mode=all \
            --no-daemon

      - name: Verify Release APK
        shell: bash
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            find android -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "Signed Release APK generated successfully:"
          ls -lh "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Planix-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean sensitive keystore
        if: always()
        shell: bash
        run: |
          rm -f android/keystore/release.jks
